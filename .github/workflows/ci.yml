name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Run lint (TypeScript + Prettier)
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, linux, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      # jest-junit não está no package.json — instala só no CI para gerar JUnit XML
      - name: Install jest-junit reporter
        run: npm install --no-save jest-junit

      - name: Run unit tests with coverage
        run: npm test -- --reporters=default --reporters=jest-junit
        env:
          CI: 'true'
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      # dorny/test-reporter — posta resultado dos testes como check no PR
      # marketplace.github.com/actions/test-reporter
      - name: Report unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Unit Tests (Jest)'
          path: reports/junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage/lcov-report

  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, linux, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: 'true'

      # Playwright já gera results.xml em formato JUnit (configurado em playwright.config.js)
      - name: Report E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'E2E Tests (Playwright / Chromium)'
          path: results.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: [self-hosted, linux, local]
    needs: [lint, unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
